name: Budowa dla macOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_mac:
    runs-on: macos-latest

    steps:
    - name: Pobranie plików
      uses: actions/checkout@v4

    - name: Instalacja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalacja bibliotek
      run: |
        python -m pip install --upgrade pip
        pip install pymupdf pyinstaller

    - name: Kompilacja na Maca
      run: |
        pyinstaller --clean --onefile --windowed --add-data "logo.png:." --add-data "ikona.ico:." --hidden-import=fitz --name "PDF_Master_by_Kriss" pdf_master.py

    - name: Spakowanie aplikacji do ZIP
      run: |
        cd dist
        zip -r PDF_Master_Mac.zip "PDF_Master_by_Kriss.app"

    - name: Udostępnienie pliku do pobrania
      uses: actions/upload-artifact@v4
      with:
        name: Aplikacja_na_Maca
        path: dist/PDF_Master_Mac.zip
